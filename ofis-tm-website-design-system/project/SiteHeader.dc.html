<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;z-index:50">
  <header style="height:72px;display:flex;align-items:center;background:var(--hdr);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);transition:background .3s">
    <div style="width:100%;max-width:1320px;margin:0 auto;padding:0 clamp(20px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:24px">
      <a href="Home.dc.html" aria-label="ofis.tm home" style="display:flex;align-items:center;flex:none">
        <img src="assets/wordmark-white.png" alt="ofis.tm" style="height:32px;width:auto;filter:var(--logo)">
      </a>
      <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
        <nav style="display:flex;align-items:center;gap:2px">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
            <a href="{{ n.href }}" style="position:relative;padding:9px 14px;border-radius:999px;font-size:15px;font-weight:500;color:{{ n.color }};white-space:nowrap;transition:background .2s,color .2s" style-hover="background:var(--bg3);color:var(--fg)">{{ n.label }}<span style="position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc);opacity:{{ n.dot }}"></span></a>
          </sc-for>
        </nav>
        <div style="display:flex;align-items:center;gap:10px;flex:none">
          <div role="group" aria-label="Language" style="display:flex;padding:3px;border:1px solid var(--line);border-radius:999px">
            <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
              <button type="button" onClick="{{ l.pick }}" title="{{ l.full }}" style="border:0;padding:6px 9px;border-radius:999px;background:{{ l.bg }};color:{{ l.color }};font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:.04em;transition:background .2s,color .2s">{{ l.code }}</button>
            </sc-for>
          </div>
          <button type="button" onClick="{{ toggleTheme }}" aria-label="Toggle colour theme" title="{{ themeLabel }}" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;transition:border-color .2s" style-hover="border-color:var(--line2)">
            <span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg);background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)"></span>
          </button>
          <a href="Contact.dc.html" style="display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:14.5px;font-weight:600;white-space:nowrap;transition:transform .2s,filter .2s" style-hover="filter:brightness(1.12);color:var(--on-acc)">{{ cta }}<span>→</span></a>
        </div>
      </sc-if>
      <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{ toggleMenu }}" aria-expanded="{{ open }}" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:14px;font-weight:500">
          <span>{{ menuLabel }}</span>
          <span style="position:relative;width:28px;height:28px;border-radius:50%;background:var(--acc)">
            <span style="position:absolute;left:8px;right:8px;top:{{ bar1Top }};height:1.5px;background:var(--on-acc);transform:{{ bar1T }};transition:transform .3s,top .3s"></span>
            <span style="position:absolute;left:8px;right:8px;top:{{ bar2Top }};height:1.5px;background:var(--on-acc);transform:{{ bar2T }};transition:transform .3s,top .3s"></span>
          </span>
        </button>
      </sc-if>
    </div>
  </header>
  <sc-if value="{{ menuVisible }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:0;right:0;top:72px;bottom:0;background:var(--bg);overflow-y:auto;padding:28px clamp(20px,4vw,48px) 40px;display:flex;flex-direction:column;gap:32px">
      <nav style="display:flex;flex-direction:column">
        <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
          <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="display:flex;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);color:var(--fg)">
            <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--acc-ink)">{{ n.num }}</span>
            <span style="font-size:clamp(30px,8vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1.05">{{ n.label }}</span>
          </a>
        </sc-for>
      </nav>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">Language</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
            <button type="button" onClick="{{ l.pick }}" style="height:48px;border-radius:12px;border:1px solid {{ l.border }};background:{{ l.bg }};color:{{ l.color }};font-size:14px;font-weight:500">{{ l.full }}</button>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:auto">
        <button type="button" onClick="{{ toggleTheme }}" style="flex:none;height:52px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:transparent;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500">
          <span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg);background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)"></span>{{ themeLabel }}
        </button>
        <a href="Contact.dc.html" style="flex:1;height:52px;border-radius:999px;background:var(--acc);color:var(--on-acc);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600">{{ cta }} →</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;72px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;work&quot;,&quot;process&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = {
    w: typeof window !== 'undefined' ? window.innerWidth : 1400,
    open: false,
    lang: (() => { try { return localStorage.getItem('ofis-lang') || 'en'; } catch (e) { return 'en'; } })(),
    theme: (() => { try { return localStorage.getItem('ofis-theme') || 'dark'; } catch (e) { return 'dark'; } })()
  };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth }, () => { if (this.state.w >= 1100 && this.state.open) this.setMenu(false); });
    window.addEventListener('resize', this.onResize);
    document.documentElement.dataset.theme = this.state.theme;
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); document.body.style.overflow = ''; }
  setMenu(open) { this.setState({ open }); document.body.style.overflow = open ? 'hidden' : ''; }
  setLang(l) {
    this.setState({ lang: l });
    try { localStorage.setItem('ofis-lang', l); } catch (e) {}
    window.dispatchEvent(new CustomEvent('ofis-lang', { detail: l }));
  }
  toggleTheme() {
    const t = this.state.theme === 'dark' ? 'light' : 'dark';
    this.setState({ theme: t });
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('ofis-theme', t); } catch (e) {}
  }
  renderVals() {
    const S = {
      en: { nav: ['Services', 'Work', 'Process', 'About', 'Contact'], cta: 'Start a project', menu: 'Menu', close: 'Close', dark: 'Dark mode', light: 'Light mode' },
      ru: { nav: ['Услуги', 'Работы', 'Процесс', 'О нас', 'Контакты'], cta: 'Начать проект', menu: 'Меню', close: 'Закрыть', dark: 'Тёмная тема', light: 'Светлая тема' },
      tk: { nav: ['Hyzmatlar', 'Işlerimiz', 'Iş tertibi', 'Biz barada', 'Habarlaşmak'], cta: 'Taslama başlaň', menu: 'Menýu', close: 'Ýap', dark: 'Garaňky', light: 'Ýagty' }
    };
    const s = S[this.state.lang] || S.en;
    const keys = ['services', 'work', 'process', 'about', 'contact'];
    const hrefs = ['Services.dc.html', 'Work.dc.html', 'Home.dc.html#process', 'About.dc.html', 'Contact.dc.html'];
    const active = this.props.active || 'home';
    const nav = keys.map((k, i) => ({
      label: s.nav[i], href: hrefs[i], num: '0' + (i + 1),
      color: k === active ? 'var(--fg)' : 'var(--fg2)', dot: k === active ? 1 : 0
    }));
    const langs = [['tk', 'TM', 'Türkmen'], ['ru', 'RU', 'Русский'], ['en', 'EN', 'English']].map(([c, code, full]) => {
      const on = this.state.lang === c;
      return { code, full, pick: () => this.setLang(c), bg: on ? 'var(--fg)' : 'transparent', color: on ? 'var(--bg)' : 'var(--fg2)', border: on ? 'var(--fg)' : 'var(--line2)' };
    });
    const desktop = this.state.w >= 1100;
    const o = this.state.open;
    return {
      desktop, mobile: !desktop, menuVisible: !desktop && o, open: o,
      nav, langs, cta: s.cta,
      menuLabel: o ? s.close : s.menu,
      themeLabel: this.state.theme === 'dark' ? s.light : s.dark,
      bar1Top: o ? '13px' : '10.5px', bar2Top: o ? '13px' : '16px',
      bar1T: o ? 'rotate(45deg)' : 'none', bar2T: o ? 'rotate(-45deg)' : 'none',
      toggleMenu: () => this.setMenu(!o), closeMenu: () => this.setMenu(false),
      toggleTheme: () => this.toggleTheme()
    };
  }
}
</script>
</body>
</html>
