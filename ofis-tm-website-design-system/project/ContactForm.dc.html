<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="color:var(--fg)">
  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div style="min-height:420px;padding:clamp(28px,4vw,48px);border:1px solid var(--line2);border-radius:20px;background:var(--bg2);display:flex;flex-direction:column;justify-content:space-between;gap:40px">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:24px;font-weight:600">✓</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-ink)">Request received</div>
        <h3 style="margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.05">{{ thanks }}</h3>
        <p style="margin:0;max-width:460px;font-size:17px;line-height:1.55;color:var(--fg2)">{{ replyLine }}</p>
      </div>
      <button type="button" onClick="{{ reset }}" style="align-self:flex-start;height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:15px;font-weight:500" style-hover="border-color:var(--fg)">Send another request</button>
    </div>
  </sc-if>
  <sc-if value="{{ editing }}" hint-placeholder-val="{{ true }}">
    <form onSubmit="{{ submit }}" noValidate="{{ true }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:20px 16px">
      <label style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">Name *</span>
        <input type="text" value="{{ f.name }}" onChange="{{ onName }}" autoComplete="name" placeholder="Your full name" style="height:54px;padding:0 16px;border-radius:12px;border:1px solid {{ bName }};background:var(--bg2);outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s" style-focus="border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)">
        <sc-if value="{{ eName }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:#FF6B6B">Please tell us your name.</span></sc-if>
      </label>
      <label style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">Company</span>
        <input type="text" value="{{ f.company }}" onChange="{{ onCompany }}" autoComplete="organization" placeholder="Company name" style="height:54px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s" style-focus="border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)">
      </label>
      <label style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">Phone / WhatsApp</span>
        <input type="tel" value="{{ f.phone }}" onChange="{{ onPhone }}" autoComplete="tel" placeholder="+993 6X XX XX XX" style="height:54px;padding:0 16px;border-radius:12px;border:1px solid {{ bContact }};background:var(--bg2);outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s" style-focus="border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)">
      </label>
      <label style="display:flex;flex-direction:column;gap:8px;min-width:0">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">Email</span>
        <input type="email" value="{{ f.email }}" onChange="{{ onEmail }}" autoComplete="email" placeholder="you@company.com" style="height:54px;padding:0 16px;border-radius:12px;border:1px solid {{ bEmail }};background:var(--bg2);outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s" style-focus="border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)">
      </label>
      <sc-if value="{{ eContact }}" hint-placeholder-val="{{ false }}">
        <span style="grid-column:1/-1;margin-top:-10px;font-size:13px;color:#FF6B6B">{{ eContactMsg }}</span>
      </sc-if>
      <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:8px;min-width:0">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">Service</span>
        <span style="position:relative;display:block">
          <select value="{{ f.service }}" onChange="{{ onService }}" style="width:100%;height:54px;padding:0 44px 0 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:none;font-size:16px;appearance:none;-webkit-appearance:none;cursor:pointer;transition:border-color .2s,box-shadow .2s" style-focus="border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)">
            <sc-for list="{{ services }}" as="s" hint-placeholder-count="7">
              <option value="{{ s }}">{{ s }}</option>
            </sc-for>
          </select>
          <span style="position:absolute;right:18px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--fg3);font-size:12px">▾</span>
        </span>
      </label>
      <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:10px">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">Budget range (USD)</span>
        <div role="radiogroup" style="display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ budgets }}" as="b" hint-placeholder-count="5">
            <button type="button" role="radio" aria-checked="{{ b.on }}" onClick="{{ b.pick }}" style="height:42px;padding:0 16px;border-radius:999px;border:1px solid {{ b.border }};background:{{ b.bg }};color:{{ b.color }};font-size:14.5px;font-weight:500;transition:background .2s,color .2s,border-color .2s">{{ b.label }}</button>
          </sc-for>
        </div>
      </div>
      <sc-if value="{{ isFull }}" hint-placeholder-val="{{ false }}">
        <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:10px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">When do you want to start?</span>
          <div role="radiogroup" style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ timelines }}" as="b" hint-placeholder-count="4">
              <button type="button" role="radio" aria-checked="{{ b.on }}" onClick="{{ b.pick }}" style="height:42px;padding:0 16px;border-radius:999px;border:1px solid {{ b.border }};background:{{ b.bg }};color:{{ b.color }};font-size:14.5px;font-weight:500;transition:background .2s,color .2s,border-color .2s">{{ b.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:10px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">Best way to reach you</span>
          <div role="radiogroup" style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ channels }}" as="b" hint-placeholder-count="4">
              <button type="button" role="radio" aria-checked="{{ b.on }}" onClick="{{ b.pick }}" style="height:42px;padding:0 16px;border-radius:999px;border:1px solid {{ b.border }};background:{{ b.bg }};color:{{ b.color }};font-size:14.5px;font-weight:500;transition:background .2s,color .2s,border-color .2s">{{ b.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:8px;min-width:0">
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)">Message</span>
        <textarea value="{{ f.message }}" onChange="{{ onMessage }}" rows="{{ rows }}" placeholder="What do you want to build or fix? Which systems do you use today?" style="padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);outline:none;font-size:16px;line-height:1.5;resize:vertical;transition:border-color .2s,box-shadow .2s" style-focus="border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)"></textarea>
      </label>
      <div style="grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;padding-top:4px">
        <span style="flex:1 1 260px;font-size:14px;line-height:1.5;color:var(--fg3)">We reply within one working day. Your details are used only to answer this request.</span>
        <button type="submit" style="flex:none;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 28px;border:0;border-radius:999px;background:var(--acc);color:var(--on-acc);font-size:16px;font-weight:600;transition:filter .2s" style-hover="filter:brightness(1.12)">Send request <span>→</span></button>
      </div>
    </form>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;720px&quot;,&quot;height&quot;:&quot;760px&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;compact&quot;,&quot;full&quot;],&quot;default&quot;:&quot;compact&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;service&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Not sure yet&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = {
    f: { name: '', company: '', phone: '', email: '', service: this.props.service || 'Not sure yet', budget: '', timeline: '', channel: 'WhatsApp', message: '' },
    tried: false, sent: false
  };
  set(k) { return e => { const v = e.target.value; this.setState(s => ({ f: { ...s.f, [k]: v } })); }; }
  pick(k, v) { this.setState(s => ({ f: { ...s.f, [k]: s.f[k] === v ? '' : v } })); }
  errors() {
    const f = this.state.f;
    const emailBad = f.email.trim() !== '' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim());
    return { name: !f.name.trim(), contact: !f.phone.trim() && !f.email.trim(), emailBad };
  }
  chips(key, list) {
    return list.map(label => {
      const on = this.state.f[key] === label;
      return { label, on, pick: () => this.pick(key, label), bg: on ? 'var(--fg)' : 'transparent', color: on ? 'var(--bg)' : 'var(--fg2)', border: on ? 'var(--fg)' : 'var(--line2)' };
    });
  }
  renderVals() {
    const f = this.state.f;
    const er = this.errors();
    const show = this.state.tried;
    const red = '#FF6B6B';
    const first = f.name.trim().split(' ')[0];
    const via = f.channel || (f.phone ? 'WhatsApp' : 'email');
    return {
      f, sent: this.state.sent, editing: !this.state.sent, isFull: this.props.variant === 'full',
      rows: this.props.variant === 'full' ? 6 : 4,
      onName: this.set('name'), onCompany: this.set('company'), onPhone: this.set('phone'),
      onEmail: this.set('email'), onService: this.set('service'), onMessage: this.set('message'),
      eName: show && er.name, bName: show && er.name ? red : 'var(--line)',
      eContact: show && (er.contact || er.emailBad),
      eContactMsg: er.contact ? 'Add a phone/WhatsApp number or an email so we can reply.' : 'That email address looks incomplete.',
      bContact: show && er.contact ? red : 'var(--line)',
      bEmail: show && (er.contact || er.emailBad) ? red : 'var(--line)',
      services: ['Not sure yet', 'Web Development', 'Mobile Apps', 'ERP Consulting & Integration', 'Data & Reporting', 'Custom Business Software', 'UI/UX Design'],
      budgets: this.chips('budget', ['Under $5k', '$5k–15k', '$15k–40k', '$40k+', 'Not sure']),
      timelines: this.chips('timeline', ['As soon as possible', 'In 1–3 months', 'In 3–6 months', 'Just exploring']),
      channels: this.chips('channel', ['WhatsApp', 'Telegram', 'Email', 'Phone call']),
      thanks: first ? `Thanks, ${first}.` : 'Thanks.',
      replyLine: `We'll review your request and reply within one working day${via ? ' via ' + via : ''}.`,
      submit: e => {
        e.preventDefault();
        const x = this.errors();
        if (x.name || x.contact || x.emailBad) { this.setState({ tried: true }); return; }
        this.setState({ sent: true, tried: false });
      },
      reset: () => this.setState(s => ({ sent: false, f: { ...s.f, message: '' } }))
    };
  }
}
</script>
</body>
</html>
